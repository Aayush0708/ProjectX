services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: projectx
      POSTGRES_PASSWORD: projectx
      POSTGRES_DB: projectx
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # creates the "proposals" bucket on startup, then exits (this is normal)
  minio-init:
    image: amazon/aws-cli
    depends_on: [minio]
    entrypoint: >
      sh -c "
      until aws --endpoint-url http://minio:9000 s3 mb s3://proposals 2>/dev/null || aws --endpoint-url http://minio:9000 s3 ls s3://proposals 2>/dev/null; do
        sleep 1;
      done;
      echo 'Proposals bucket is ready!';
      "
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: auto

  gotenberg:
    image: gotenberg/gotenberg:8
    ports: ["3001:3000"] # 3001 on your machine, because Next.js will use 3000

volumes:
  pgdata:
  miniodata:
